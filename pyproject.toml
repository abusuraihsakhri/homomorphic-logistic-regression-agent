[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homomorphic-logistic-regression-engine"
version = "2.0.0"
description = "HE-LogisticReg: Encrypted Gradient Descent & Clinical Risk Scorer Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["agents*", "he_logistic_reg*"]

[project.scripts]
homomorphic-logistic-regression-engine = "he_logistic_reg.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/homomorphic-logistic-regression-agent"
Repository = "https://github.com/abusuraihsakhri/homomorphic-logistic-regression-agent.git"
